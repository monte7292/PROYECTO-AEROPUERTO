<!-- header.html -->
<header th:fragment="header"
        xmlns:th="http://www.w3.org/1999/xhtml"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm fixed-top top-0 z-3">
        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand fw-bold text-primary" th:href="@{/}">
                AeroMontero
            </a>

            <!-- Botón móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse" aria-controls="navbarCollapse"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido -->
            <div class="collapse navbar-collapse" id="navbarCollapse">

                <!-- IZQUIERDA: navegación -->
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/directores}" th:text="#{msg.navbar.directores}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/aeropuertos}" th:text="#{msg.navbar.aeropuertos}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/aviones}" th:text="#{msg.navbar.aviones}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tickets}" th:text="#{msg.navbar.tickets}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pasajeros}" th:text="#{msg.navbar.pasajeros}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/trabajadores}" th:text="#{msg.navbar.trabajadores}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/rutas}" th:text="#{msg.navbar.rutas}"></a>
                    </li>
                </ul>

                <!-- DERECHA: usuario + login/logout -->
                <ul class="navbar-nav mb-2 mb-md-0 align-items-md-center">

                    <!-- Usuario -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="navbar-text me-3">
                            Bienvenido, <strong><span sec:authentication="name"></span></strong>
                        </span>
                    </li>

                    <!-- Login -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>

                    <!-- Logout -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="#"
                           onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                            Logout
                        </a>
                        <form id="logout-form" th:action="@{/logout}" method="post" class="d-none"></form>
                    </li>

                </ul>

                <!-- Idioma -->
                <div class="d-none d-md-flex align-items-center gap-2 ms-3">
                    <img th:src="${#locale.language == 'es'} ?
                                 'https://flagcdn.com/w20/es.png' :
                                 'https://flagcdn.com/w20/gb.png'"
                         width="20" height="15" alt="Lang">
                    <select id="lang-select" class="form-select form-select-sm">
                        <option value="es" th:selected="${#locale.language == 'es'}">Español</option>
                        <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                    </select>
                </div>

            </div>
        </div>
    </nav>

    <!-- Script cambio de idioma -->
    <script>
        (function () {
            const sel = document.getElementById('lang-select');
            if (!sel) return;
            sel.addEventListener('change', function () {
                const url = new URL(window.location.href);
                url.searchParams.set('lang', sel.value);
                window.location.href = url.toString();
            });
        })();
    </script>

</header>
