<!-- header.html -->
<header th:fragment="header" xmlns:th="http://www.w3.org/1999/xhtml">

    <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm fixed-top top-0 z-3">
        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand fw-bold text-primary" href="#" th:href="@{/}">
                AéreoMontero
            </a>

            <!-- Botón móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse" aria-controls="navbarCollapse"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarCollapse">

                <!-- Navegación -->
                <ul class="navbar-nav mx-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/aeropuertos}" th:text="#{msg.navbar.aeropuertos}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/directores}" th:text="#{msg.navbar.directores}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/aviones}" th:text="#{msg.navbar.aviones}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tickets}" th:text="#{msg.navbar.tickets}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pasajeros}" th:text="#{msg.navbar.pasajeros}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/rutas}" th:text="#{msg.navbar.rutas}"></a>
                    </li>
                </ul>

                <!-- Idioma -->
                <form th:action="@{/}" method="get" class="d-none d-md-flex position-absolute end-0 me-3 align-items-center gap-2">
                    <img th:src="${#locale.language == 'es'} ? 'https://flagcdn.com/w20/es.png' : 'https://flagcdn.com/w20/gb.png'" width="20" height="15" alt="Lang">
                    <select name="lang" onchange="this.form.submit()" class="form-select">
                        <option value="es" th:selected="${#locale.language == 'es'}">Español</option>
                        <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                    </select>
                </form>

            </div>
        </div>
    </nav>

</header>
