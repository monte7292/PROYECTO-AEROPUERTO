<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Aeropuerto Montero')"></head>
<style>
.feature-card{border:0;border-radius:1rem;overflow:hidden;position:relative;transition:transform .3s ease,box-shadow .3s ease}
.feature-card:hover{transform:translateY(-4px);box-shadow:0 .75rem 1.5rem rgba(0,0,0,.15)}
.feature-img{height:220px;width:100%;object-fit:cover;filter:brightness(65%);transition:transform .5s ease,filter .3s ease}
.feature-card:hover .feature-img{transform:scale(1.05);filter:brightness(55%)}
.feature-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,) 100%);color:#fff}
.feature-overlay .card-title{font-weight:700}
.feature-overlay .card-text{font-size:.95rem;opacity:.95}
.feature-btn{background:#fff;color:#0d6efd;border:0}
.feature-btn:hover{background:#e9ecef;color:#0b5ed7}
</style>
<body class="d-flex flex-column h-100">
<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="flex-shrink-0">
    <div class="container py-5 mt-5">

        <!-- Banner principal -->
        <!-- Banner principal con imagen de fondo -->
        <div class="p-5 mb-5 text-white rounded-3 shadow" style="background: url('https://www.itcsa.es/wp-content/uploads/Terminal-aeropuerto-1-850x491.jpg') no-repeat center center; background-size: cover;">
            <div class="container py-4 px-4" style="background-color: rgba(0, 0, 0, 0.5); border-radius: 15px;">
                <h1 class="display-4 fw-bold" th:text="#{msg.index.bienvenida}"></h1>
                <p class="col-md-8 fs-5" th:text="#{msg.index.mensajeDebajoBienvenida}"></p>
                <a href="/rutas" class="btn btn-primary btn-lg" th:text="#{msg.index.botonVerVuelos}"></a>
            </div>
        </div>

        <section class="py-3 d-flex">
            <div class="container">
                <p class="fs-5 text-left" th:text="#{msg.index.textoLargo}"></p>
            </div>
        </section>



        <!-- Secciones rápidas -->
        <div class="row text-center g-4">
            <div class="col-md-4">
                <a href="/aeropuertos" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://www.avionrevue.com/wp-content/uploads/2024/01/mexico-aerop.jpg" alt="Aeropuertos" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion1}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion1.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion1.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/directores" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://images.pexels.com/photos/3184306/pexels-photo-3184306.jpeg" alt="Directores" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion2}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion2.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion2.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/aviones" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://brix.afklcargo.com/otf/images/media/97085C1E-0CF3-49C2-B22461DE22C4C9C6" alt="Aviones" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion3}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion3.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion3.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/pasajeros" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://static.nationalgeographicla.com/files/styles/image_3200/public/h_15392413.webp?w=1600&h=900" alt="Pasajeros" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion4}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion4.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion4.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/rutas" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhssEAWyZIzgrR8Nbfnw2-rcKioF6SkUCbsWm1zJB71QAGWp0nFMzE4mYYdrSwwoLi9G5Ok5xXKhE8rhJIsSrM-95TRJOADpS5WiXvjm7dRO6X2dz0ui0s3TH_WHlTHviCU2_RBBTHyjF4/s1600/SUP2.JPG" alt="Rutas" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion5}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion5.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion5.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/trabajadores" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://images.pexels.com/photos/936137/pexels-photo-936137.jpeg" alt="Trabajadores" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion6}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion6.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion6.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="/tickets" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <img src="https://images.pexels.com/photos/374879/pexels-photo-374879.jpeg" alt="Tickets" class="feature-img">
                        <div class="feature-overlay">
                            <h5 class="card-title" th:text="#{msg.index.seccion7}"></h5>
                            <p class="card-text" th:text="#{msg.index.seccion7.texto}"></p>
                            <span class="btn btn-primary btn-sm w-100 text-center" th:text="#{msg.index.seccion7.boton}"></span>
                        </div>
                    </div>
                </a>
            </div>

        </div>

    </div>
</main>


</body>
</html>
