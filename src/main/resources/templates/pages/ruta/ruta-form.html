<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Insertar/Actualizar Ruta')"></head>
<body>
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
    <!-- Banner principal con imagen de fondo -->
    <div class="p-5 mb-5 text-white rounded-3 shadow" style="background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhssEAWyZIzgrR8Nbfnw2-rcKioF6SkUCbsWm1zJB71QAGWp0nFMzE4mYYdrSwwoLi9G5Ok5xXKhE8rhJIsSrM-95TRJOADpS5WiXvjm7dRO6X2dz0ui0s3TH_WHlTHviCU2_RBBTHyjF4/s1600/SUP2.JPG') no-repeat center center; background-size: cover;">
        <div class="container py-4 px-4" style="background-color: rgba(0, 0, 0, 0.5); border-radius: 15px;">
            <h1 class="display-4 fw-bold" th:text="#{msg.ruta.title}"></h1>
            <p class="col-md-8 fs-5" th:text="#{msg.ruta.descripcion}"></p>
        </div>
    </div>
    <h1 th:text="${ruta.id} == null ? #{msg.ruta.nueva} : #{msg.ruta.editar}"></h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="${ruta.id} == null ? @{/rutas/insert} : @{/rutas/update}"
          th:object="${ruta}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}" />

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="origen" class="form-label" th:text="#{msg.ruta.aeropuerto.origen}"></label>
                <select th:field="*{aeropuertoOrigen.id}" id="origen" class="form-select">
                    <option th:each="a : ${listAeropuertos}" th:value="${a.id}" th:text="${a.nombre}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="destino" class="form-label" th:text="#{msg.ruta.aeropuerto.destino}"></label>
                <select th:field="*{aeropuertoDestino.id}" id="destino" class="form-select">
                    <option th:each="a : ${listAeropuertos}" th:value="${a.id}" th:text="${a.nombre}"></option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="duracion" class="form-label" th:text="#{msg.ruta.duracion}"></label>
                <input type="number" th:field="*{duracion}" id="duracion" class="form-control" />
            </div>
            <div class="col-md-6">
                <label for="distancia" class="form-label" th:text="#{msg.ruta.distancia}"></label>
                <input type="number" th:field="*{distancia}" id="distancia" class="form-control" />
            </div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary" th:text="${ruta.id} == null ? #{msg.ruta.crear} : #{msg.ruta.update}"></button>
            <a th:href="@{/rutas}" class="btn btn-secondary" th:text="#{msg.back}"></a>
        </div>
    </form>
</main>

</body>
</html>
