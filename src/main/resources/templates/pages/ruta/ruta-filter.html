<div th:fragment="rutaFilter(search, sort, currentPage)">
    <form class="row g-3 mt-3 mb-3" method="get" th:action="@{/rutas}">
        <div class="col-md-5">
            <input class="form-control" name="search" placeholder="Filtrar" th:value="${search}" type="text">
        </div>
        <div class="col-md-4">
            <select class="form-select" name="sort" th:value="${sort}">
                <option disabled th:selected="${sort == null}" value="">Ordenar por...</option>
                <option th:selected="${sort == 'aeropuertoOrigenAsc'}" value="aeropuertoOrigenAsc">Origen (A-Z)</option>
                <option th:selected="${sort == 'aeropuertoOrigenDesc'}" value="aeropuertoOrigenDesc">Origen (Z-A)</option>
                <option th:selected="${sort == 'aeropuertoDestinoAsc'}" value="aeropuertoDestinoAsc">Destino (A-Z)</option>
                <option th:selected="${sort == 'aeropuertoDestinoDesc'}" value="aeropuertoDestinoDesc">Destino (Z-A)</option>
                <option th:selected="${sort == 'duracionAsc'}" value="duracionAsc">Duración (asc)</option>
                <option th:selected="${sort == 'duracionDesc'}" value="duracionDesc">Duración (desc)</option>
                <option th:selected="${sort == 'distanciaAsc'}" value="distanciaAsc">Distancia (asc)</option>
                <option th:selected="${sort == 'distanciaDesc'}" value="distanciaDesc">Distancia (desc)</option>
                <option th:selected="${sort == 'idAsc'}" value="idAsc">ID (asc)</option>
                <option th:selected="${sort == 'idDesc'}" value="idDesc">ID (desc)</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">Filtrar</button>
        </div>
        <div class="col-md-1 d-flex justify-content-end">
            <a class="btn btn-secondary w-100" th:href="@{/rutas}">Limpiar</a>
        </div>
    </form>
</div>
