<!-- Sección de filtrado -->
<div th:fragment="avionFilter(search, sort, currentPage)">
    <form class="row g-3 mt-3 mb-3" method="get" th:action="@{/aviones}">

        <!-- Campo búsqueda -->
        <div class="col-md-5">
            <input class="form-control" name="search"
                   placeholder="Filtrar por modelo o fabricante"
                   th:value="${search}"
                   type="text">
        </div>

        <!-- Selector ordenación -->
        <div class="col-md-4">
            <select class="form-select" name="sort" th:value="${sort}">
                <option disabled th:selected="${sort == null}" value="">
                    Ordenar por...
                </option>
                <option th:selected="${sort == 'modeloAsc'}" value="modeloAsc">Modelo (A-Z)</option>
                <option th:selected="${sort == 'modeloDesc'}" value="modeloDesc">Modelo (Z-A)</option>
                <option th:selected="${sort == 'fabricanteAsc'}" value="fabricanteAsc">Fabricante (A-Z)</option>
                <option th:selected="${sort == 'fabricanteDesc'}" value="fabricanteDesc">Fabricante (Z-A)</option>
                <option th:selected="${sort == 'capacidadAsc'}" value="capacidadAsc">Capacidad (A-Z)</option>
                <option th:selected="${sort == 'capacidadDesc'}" value="capacidadDesc">Capacidad (Z-A)</option>
                <option th:selected="${sort == 'aeropuertoAsc'}" value="aeropuertoAsc">Aeropuerto (A-Z)</option>
                <option th:selected="${sort == 'aeropuertoDesc'}" value="aeropuertoDesc">Aeropuerto (Z-A)</option>
                <option th:selected="${sort == 'idAsc'}" value="idAsc">ID (ascendente)</option>
                <option th:selected="${sort == 'idDesc'}" value="idDesc">ID (descendente)</option>
            </select>
        </div>

        <!-- Botón Filtrar -->
        <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit" th:text="#{msg.filter}"></button>
        </div>

        <!-- Botón Limpiar -->
        <div class="col-md-1 d-flex justify-content-end">
            <a class="btn btn-secondary w-100" th:href="@{/aviones}" th:text="#{msg.clear}"></a>
        </div>

    </form>
</div>
