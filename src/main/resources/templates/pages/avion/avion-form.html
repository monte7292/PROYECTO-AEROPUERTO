<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Insertar/Actualizar Avion')"></head>
<style>
    /* Margen superior personalizado */
    .mt-10 {
        margin-top: 4.5rem; /* Ajusta el valor si quieres más o menos */
    }

    /* Grid de 3 columnas para el formulario */
    .grid-form {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem; /* espacio entre celdas */
    }

    /* Hacer que los botones estén juntos en una fila */
    .grid-form .buttons {
        grid-column: 1 / -1; /* ocupa las 3 columnas */
        display: flex;
        gap: 1rem;
        justify-content: flex-start; /* puedes poner center si quieres centrado */
        margin-top: 1rem;
    }
</style>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-10">
    <!-- Banner principal con imagen de fondo -->
    <div class="p-5 mb-5 text-white rounded-3 shadow" style="background: url('https://brix.afklcargo.com/otf/images/media/97085C1E-0CF3-49C2-B22461DE22C4C9C6') no-repeat center center; background-size: cover;">
        <div class="container py-4 px-4" style="background-color: rgba(0, 0, 0, 0.5); border-radius: 15px;">
            <h1 class="display-4 fw-bold">Gestión de Aviones</h1>
            <p class="col-md-8 fs-5">
                Administra de forma eficiente toda la información relacionada con los aviones de la empresa. Consulta detalles operativos, agrega nuevos aviones al sistema, actualiza datos de infraestructura y controla la disponibilidad de servicios clave.
            </p>
        </div>
    </div>
    <h1 th:text="${avion.id} == null ? #{msg.avion.add} : #{msg.avion.edit}"></h1>

    <!-- Mensaje de error -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="${avion.id} == null ? @{/aviones/insert} : @{/aviones/update}"
          th:object="${avion}" method="post" class="mt-4 grid-form">
        <input type="hidden" th:field="*{id}" />

        <!-- Modelo -->
        <div>
            <label for="modelo" class="form-label" th:text="#{msg.avion.modelo}"></label>
            <input type="text" th:field="*{modelo}" id="modelo" class="form-control" required />
            <div th:if="${#fields.hasErrors('modelo')}" class="text-danger" th:errors="*{modelo}"></div>
        </div>

        <!-- Fabricante -->
        <div>
            <label for="fabricante" class="form-label" th:text="#{msg.avion.fabricante}"></label>
            <input type="text" th:field="*{fabricante}" id="fabricante" class="form-control" required/>
            <div th:if="${#fields.hasErrors('fabricante')}" class="text-danger" th:errors="*{fabricante}"></div>
        </div>

        <!-- Capacidad -->
        <div>
            <label for="capacidad" class="form-label" th:text="#{msg.avion.capacidad}"></label>
            <input type="number" min="1" max="999" step="1" inputmode="numeric" th:field="*{capacidad}" id="capacidad" class="form-control" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
            <div th:if="${#fields.hasErrors('capacidad')}" class="text-danger" th:errors="*{capacidad}"></div>
        </div>

        <!-- Estado -->
        <div>
            <label for="estado" class="form-label" th:text="#{msg.avion.estado}"></label>
            <input type="text" th:field="*{estado}" id="estado" class="form-control" required />
            <div th:if="${#fields.hasErrors('estado')}" class="text-danger" th:errors="*{estado}"></div>
        </div>

        <!-- Aeropuerto -->
        <div>
            <label for="aeropuerto" class="form-label" th:text="#{msg.avion.aeropuerto}"></label>
            <select th:field="*{aeropuerto.id}" id="aeropuerto" class="form-select">
                <option th:each="aeropuerto : ${listAeropuertos}"
                        th:value="${aeropuerto.id}"
                        th:text="${aeropuerto.nombre}">
                </option>
            </select>
            <div th:if="${#fields.hasErrors('aeropuerto.id')}" class="text-danger" th:errors="*{aeropuerto.id}"></div>
        </div>

        <!-- Botones -->
        <div class="buttons">
            <button type="submit" class="btn btn-primary" th:text="${avion.id} == null ? #{msg.avion.create} : #{msg.avion.update}"></button>
            <a href="#" th:href="@{/aviones}" class="btn btn-secondary" th:text="#{msg.back}"></a>
        </div>
    </form>
</main>
<!-- Incluir el fragmento del footer -->


</body>
</html>
