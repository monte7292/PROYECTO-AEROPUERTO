<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head ('Detalles del Avión')}"></head>
<style>
    .mt-10 { margin-top: 4.5rem; }
    .section-card { background-color: #fff; border-radius: 12px; box-shadow: 0 0.35rem 1.2rem rgba(0,0,0,.08); padding: 1.25rem; }
    .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; }
    .section-title { font-weight: 600; font-size: 0.95rem; color: #495057; }
    .value { font-size: 1.05rem; }
    .badge-soft { background-color: #eef2ff; color: #1f3b73; border-radius: 6px; padding: .35rem .6rem; }
    .table thead th { background-color: #f8f9fa; }
    .select-wide { max-width: 540px; }
</style>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="container mt-10">

    <!-- Banner principal con imagen de fondo -->
    <div class="p-5 mb-5 text-white rounded-3 shadow" style="background: url('https://brix.afklcargo.com/otf/images/media/97085C1E-0CF3-49C2-B22461DE22C4C9C6') no-repeat center center; background-size: cover;">
        <div class="container py-4 px-4" style="background-color: rgba(0, 0, 0, 0.5); border-radius: 15px;">
            <h1 class="display-4 fw-bold" th:text="#{msg.avion-detail.titleSegundo}"></h1>
            <p class="col-md-8 fs-5" th:text="#{msg.avion-detail.descripcion}"></p>
        </div>
    </div>

    <h1 th:text="#{msg.avion-detail.avion.detail} + ' - ' + ${avion.id}"></h1>

    <!-- Muestra un mensaje de error si hay algún problema -->
    <div class="alert alert-danger" th:if="${errorMessage}">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="section-card mb-4">
        <div class="info-grid">
            <div>
                <div class="section-title" th:text="#{msg.avion-detail.avion.modelo}"></div>
                <div class="value" th:text="${avion.modelo}"></div>
            </div>
            <div>
                <div class="section-title" th:text="#{msg.avion-fabricante.avion.fabricante}"></div>
                <div class="value" th:text="${avion.fabricante}"></div>
            </div>
            <div>
                <div class="section-title" th:text="#{msg.avion-capacidad.avion.capacidad}"></div>
                <div class="value"><span class="badge-soft" th:text="${avion.capacidad}"></span></div>
            </div>
            <div>
                <div class="section-title" th:text="#{msg.avion-estado.avion.estado}"></div>
                <div class="value"><span class="badge-soft" th:text="${avion.estado}"></span></div>
            </div>
            <div>
                <div class="section-title" th:text="#{msg.avion-aeropuerto.avion.aeropuerto}"></div>
                <div class="value" th:text="${avion.aeropuerto.nombre}"></div>
            </div>
        </div>
    </div>

    <!-- Muestra la lista de productos asociados al avión en una tabla -->
    <h3 th:text="#{msg.avion-detail.avion.pasajeros.associated}"></h3>
    <table class="table table-striped table-hover align-middle mt-3">
        <thead>
        <tr>
            <th th:text="#{msg.avion-detail.pasajero.nombre}"></th>
            <th th:text="#{msg.avion-detail.pasajero.apellidos}"></th>
            <th th:text="#{msg.avion-detail.pasajero.documento}"></th>
            <th th:text="#{msg.avion-detail.pasajero.email}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pasajero : ${pasajeros}">
            <td th:text="${pasajero.nombre}"></td>
            <td th:text="${pasajero.apellidos}"></td>
            <td th:text="${pasajero.documento}"></td>
            <td th:text="${pasajero.email}"></td>
            <td>
                <!-- Botón para eliminar el pasajero del avión -->
                <form class="d-inline" method="post" th:action="@{/aviones/removePasajero}">
                    <input name="avionId" th:value="${avion.id}" type="hidden"/>
                    <input name="pasajeroId" th:value="${pasajero.id}" type="hidden"/>
                    <button class="btn btn-danger btn-sm" th:text="#{msg.avion-detail.pasajero.remove}"
                            type="submit"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Añadir pasajero existente mediante desplegable -->
    <h3 th:text="#{msg.avion-detail.avion.pasajero.addExisting}"></h3>
    <form class="section-card mb-3" method="post" th:action="@{/aviones/addPasajero}">
        <input name="avionId" th:value="${avion.id}" type="hidden"/>
        <div class="mb-3">
            <label class="form-label" for="pasajeroId" th:text="#{msg.avion-detail.avion.searchPasajero}"></label>
            <select class="form-select select-wide" id="pasajeroId" name="pasajeroId" required>
                <option disabled selected value="">Seleccione un pasajero...</option>
                <option th:each="p : ${allPasajeros}" th:value="${p.id}"
                        th:text="${p.nombre} + ' ' + ${p.apellidos} + ' - ' + ${p.documento}"></option>
            </select>
        </div>
        <button class="btn btn-success" th:text="#{msg.avion-detail.pasajero.add}" type="submit"></button>
    </form>

    <!-- Formulario para añadir un nuevo producto al avión -->
    <h3 th:text="#{msg.avion-detail.avion.pasajero.addNew}"></h3>
    <form class="section-card mb-3" method="post" th:action="@{/aviones/addNewPasajero}">
        <input name="avionId" th:value="${avion.id}" type="hidden"/>
        <div class="mb-3">
            <label class="form-label" for="pasajeroNombre" th:text="#{msg.avion-detail.pasajero.nombre}"></label>
            <input class="form-control" id="pasajeroNombre" name="pasajeroNombre" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="pasajeroApellidos" th:text="#{msg.avion-detail.pasajero.apellidos}"></label>
            <input class="form-control" id="pasajeroApellidos" name="pasajeroApellidos" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="pasajeroDocumento" th:text="#{msg.avion-detail.pasajero.documento}"></label>
            <input class="form-control" id="pasajeroDocumento" name="pasajeroDocumento" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="pasajeroEmail" th:text="#{msg.avion-detail.pasajero.email}"></label>
            <input class="form-control" id="pasajeroEmail" name="pasajeroEmail" required type="email">
        </div>
        <button class="btn btn-success" th:text="#{msg.avion-detail.pasajero.create}" type="submit"></button>
         <!-- Botón para volver a la lista de aviones -->
    <a class="btn btn-secondary mt-3" th:href="@{/aviones}" th:text="#{msg.back}"></a>
    </form>

   
</main>

</body>
</html>
