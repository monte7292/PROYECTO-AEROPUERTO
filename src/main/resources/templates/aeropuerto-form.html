<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Insertar/Actualizar Aeropuerto')"></head>
<style>
    /* Margen superior personalizado */
    .mt-10 {
        margin-top: 4.5rem; /* Ajusta el valor si quieres más o menos */
    }

    /* Grid de 3 columnas para el formulario */
    .grid-form {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem; /* espacio entre celdas */
    }

    /* Hacer que los botones estén juntos en una fila */
    .grid-form .buttons {
        grid-column: 1 / -1; /* ocupa las 3 columnas */
        display: flex;
        gap: 1rem;
        justify-content: flex-start; /* puedes poner center si quieres centrado */
        margin-top: 1rem;
    }
</style>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-10">
    <!-- Banner principal con imagen de fondo -->
    <div class="p-5 mb-5 text-white rounded-3 shadow" style="background: url('https://www.avionrevue.com/wp-content/uploads/2024/01/mexico-aerop.jpg') no-repeat center center; background-size: cover;">
        <div class="container py-4 px-4" style="background-color: rgba(0, 0, 0, 0.5); border-radius: 15px;">
            <h1 class="display-4 fw-bold">Gestión de Aeropuertos</h1>
            <p class="col-md-8 fs-5">
                Administra de forma eficiente toda la información relacionada con los aeropuertos de la empresa. Consulta detalles operativos, agrega nuevos aeropuertos al sistema, actualiza datos de infraestructura y controla la disponibilidad de servicios clave.
            </p>
        </div>
    </div>
    <h1 th:text="${aeropuerto.id} == null ? #{msg.aeropuerto.anadir} : #{msg.aeropuerto.editar}"></h1>

    <!-- Mensaje de error -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="${aeropuerto.id} == null ? @{/aeropuertos/insert} : @{/aeropuertos/update}"
          th:object="${aeropuerto}" method="post" class="mt-4 grid-form">
        <input type="hidden" th:field="*{id}" />

        <!-- Nombre -->
        <div>
            <label for="nombre" class="form-label" th:text="#{msg.aeropuerto.name}"></label>
            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" />
            <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></div>
        </div>

        <!-- Ciudad -->
        <div>
            <label for="ciudad" class="form-label" th:text="#{msg.aeropuerto.ciudad}"></label>
            <input type="text" th:field="*{ciudad}" id="ciudad" class="form-control" />
            <div th:if="${#fields.hasErrors('ciudad')}" class="text-danger" th:errors="*{ciudad}"></div>
        </div>

        <!-- País -->
        <div>
            <label for="pais" class="form-label" th:text="#{msg.aeropuerto.pais}"></label>
            <input type="text" th:field="*{pais}" id="pais" class="form-control" />
            <div th:if="${#fields.hasErrors('pais')}" class="text-danger" th:errors="*{pais}"></div>
        </div>

        <!-- Código IATA -->
        <div>
            <label for="codIata" class="form-label" th:text="#{msg.aeropuerto.codIata}"></label>
            <input type="text" th:field="*{codIata}" id="codIata" class="form-control" />
            <div th:if="${#fields.hasErrors('codIata')}" class="text-danger" th:errors="*{codIata}"></div>
        </div>

        <!-- Director -->
        <div>
            <label for="director" class="form-label" th:text="#{msg.aeropuerto.director}"></label>
            <select th:field="*{director.id}" id="director" class="form-select">
                <option th:each="dir : ${directores}"
                        th:value="${dir.id}"
                        th:text="${dir.nombre} + ' ' + ${dir.apellidos}">
                </option>
            </select>
            <div th:if="${#fields.hasErrors('director.id')}" class="text-danger" th:errors="*{director.id}"></div>
        </div>

        <!-- Botones -->
        <div class="buttons">
            <button type="submit" class="btn btn-primary" th:text="${aeropuerto.id} == null ? #{msg.aeropuerto.crear} : #{msg.aeropuerto.actualizar}"></button>
            <a href="#" th:href="@{/aeropuertos}" class="btn btn-secondary" th:text="#{msg.aeropuerto.back}"></a>
        </div>
    </form>
</main>
<!-- Incluir el fragmento del footer -->


</body>
</html>
