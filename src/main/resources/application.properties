spring.application.name=aeropuerto
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always
spring.messages.encoding=UTF-8
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG
spring.datasource.hikari.maximum-pool-size=10

#Arreglo de camelCase
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
# Este es el campo que se recuperará para mostrar en las pantallas, en este caso login significa el nombre de usuario
# con el que se hace login
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Autenticación con Atlassian
spring.security.oauth2.client.registration.atlassian.client-id=${ATLASSIAN_CLIENT_ID}
spring.security.oauth2.client.registration.atlassian.client-secret=${ATLASSIAN_CLIENT_SECRET}
spring.security.oauth2.client.registration.atlassian.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.atlassian.redirect-uri={baseUrl}/login/oauth2/code/atlassian
spring.security.oauth2.client.registration.atlassian.scope[0]=read:me
spring.security.oauth2.client.registration.atlassian.scope[1]=read:account

spring.security.oauth2.client.provider.atlassian.authorization-uri=https://auth.atlassian.com/authorize
spring.security.oauth2.client.provider.atlassian.token-uri=https://auth.atlassian.com/oauth/token
spring.security.oauth2.client.provider.atlassian.user-info-uri=https://api.atlassian.com/me
spring.security.oauth2.client.provider.atlassian.user-name-attribute=account_id


# Autenticación con Discord
# Autenticación con Discord
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET}
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/discord
spring.security.oauth2.client.registration.discord.scope=identify,email

spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=username
